services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churn_prediction_api
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: churn_prediction_streamlit
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
