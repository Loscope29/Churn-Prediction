[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "churn_prediction"
version = "0.0.1"
description = "Service MLOps de Prédiction de Churn Client."
authors = [
  { name = "Darryl NOAH" },
]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
src = ["Churn Prediction", "api", "streamlit_app"]
